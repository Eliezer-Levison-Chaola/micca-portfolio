backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Content"
    files:
      - file: "_data/content.json"
        label: "Homepage Fields"
        name: "homepage_data"
        fields:
          - { label: "Hero Name", name: "hero_name", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "Hero Description", name: "hero_description", widget: "text" }
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Text", name: "about_text", widget: "text" }
          - { label: "Institution", name: "institution", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }